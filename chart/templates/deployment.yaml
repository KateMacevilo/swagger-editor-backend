apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swagger-editor-backend.fullname" . }}
  labels:
    {{- include "swagger-editor-backend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "swagger-editor-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "swagger-editor-backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "swagger-editor-backend.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.gitlabCa.enabled }}
      volumes:
        - name: truststore
          emptyDir: {}
        - name: gitlab-ca
          configMap:
            name: {{ .Values.gitlabCa.configMap }}
      initContainers:
        - name: init-truststore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command: ["sh", "-c"]
          args:
            - |
              cp "$JAVA_HOME/lib/security/cacerts" /truststore/cacerts &&
              for f in /ca/*.crt; do
                [ -e "$f" ] || continue
                keytool -importcert -trustcacerts -keystore /truststore/cacerts \
                  -storepass changeit -noprompt -alias "$(basename "$f" .crt)" -file "$f"
              done
          volumeMounts:
            - name: truststore
              mountPath: /truststore
            - name: gitlab-ca
              mountPath: /ca
              readOnly: true
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.gitlabCa.enabled }}
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
          {{- end }}
          {{- if .Values.gitlabCa.enabled }}
          volumeMounts:
            - name: truststore
              mountPath: /truststore
              readOnly: true
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.serverPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "swagger-editor-backend.fullname" . }}-config
            - secretRef:
                name: {{ include "swagger-editor-backend.fullname" . }}-gitlab
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
