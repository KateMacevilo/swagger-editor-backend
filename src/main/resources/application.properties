server.port=8080

# Max upload file size for spec import
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# GitLab integration.
# gitlab.token is a secret: provide it via the GITLAB_TOKEN environment variable
# or a Kubernetes Secret (see chart/). Never commit a real token here.
gitlab.token=${GITLAB_TOKEN:}

# Default project for this project storage.
# Use a plain namespace path (e.g. my-group/my-project), not a full URL.
# Override at runtime with GITLAB_PROJECT and GITLAB_BRANCH env vars.
# For a self-hosted GitLab instance also set GITLAB_URL (default https://gitlab.com).
gitlab.project=${GITLAB_PROJECT:KateMacevilo/swagger-editor-backend}
gitlab.branch=${GITLAB_BRANCH:main}
gitlab.url=${GITLAB_URL:https://gitlab.com}
