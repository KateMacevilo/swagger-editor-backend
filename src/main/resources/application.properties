server.port=8080

# Max upload file size for spec import
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# GitHub integration.
# github.token is a secret: provide it via the GITHUB_TOKEN environment variable
# or a Kubernetes Secret (see chart/). Never commit a real token here.
github.token=${GITHUB_TOKEN:}

# Default repository for this project.
# Use plain owner/repo names, not a full URL.
# Override at runtime with GITHUB_OWNER, GITHUB_REPO and GITHUB_BRANCH env vars.
github.owner=${GITHUB_OWNER:KateMacevilo}
github.repo=${GITHUB_REPO:swagger-editor-backend}
github.branch=${GITHUB_BRANCH:main}
